services:
  db:
    image: postgres:16
    container_name: notes-postgres
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: notes-api
    ports:
      - "8000:8000"
    depends_on:
      db:
       condition: service_healthy
    env_file:
      - .env.docker

volumes:
  postgres_data:
